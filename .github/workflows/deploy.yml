name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages, and to mint the id-token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The game is plain static files with no build step. Assemble only what the
      # browser actually needs, so the dev server, the tools and the CI config
      # don't get published alongside it.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          cp -r css js audio _site/
          # Tell Pages not to run Jekyll, which would otherwise drop files and
          # directories whose names begin with an underscore.
          touch _site/.nojekyll

          # Pages serves assets with max-age=600. Without a per-deploy version on
          # every local asset URL, a returning player can get a fresh index.html
          # paired with ten-minute-old JavaScript — and these scripts depend on
          # each other, so that mix does not merely look stale, it can break.
          # Stamping the commit sha onto each reference makes every deploy a
          # clean cache miss, atomically.
          V="${GITHUB_SHA::8}"
          # '#' as the s/// delimiter: the pattern's own alternations contain
          # '|' and the paths contain '/', so either would terminate it early.
          sed -i -E "s#(<(link|script)[^>]*(href|src)=\")((css|js)/[^\"]+)\"#\1\4?v=$V\"#g" _site/index.html
          echo "stamped assets with v=$V"
          grep -c "?v=$V" _site/index.html

      - name: Sanity-check the staged site
        run: |
          set -e
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/audio/deep-cave-echoes.mp3
          for f in rng words settings audio difficulty scene cave effects entities typing ui net game main; do
            test -f "_site/js/$f.js" || { echo "missing js/$f.js"; exit 1; }
          done
          for f in grunts mids bosses; do
            test -f "_site/js/monsters/$f.js" || { echo "missing js/monsters/$f.js"; exit 1; }
          done

          # Every local asset the page references must exist in the artifact, and
          # must carry a version stamp. This catches both a typo in a script tag
          # and a stamping regex that mangled the paths it rewrote.
          missing=0
          unstamped=0
          refs=0
          for ref in $(grep -oE '(href|src)="(css|js)/[^"]+"' _site/index.html \
                       | sed -E 's/^(href|src)="//; s/"$//'); do
            refs=$((refs + 1))
            case "$ref" in *"?v="*) ;; *) echo "UNSTAMPED: $ref"; unstamped=1 ;; esac
            path="${ref%%\?*}"
            [ -f "_site/$path" ] || { echo "MISSING: $path"; missing=1; }
          done
          echo "checked $refs local asset references"
          echo "audio: $(du -h _site/audio/deep-cave-echoes.mp3 | cut -f1)"
          [ "$refs" -ge 18 ] || { echo "expected at least 18 asset refs, found $refs"; exit 1; }
          [ "$missing" -eq 0 ] && [ "$unstamped" -eq 0 ]
          echo "staged $(find _site -type f | wc -l) files"

      - name: Check every script parses
        run: |
          set -e
          find _site/js -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "all scripts parse"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
